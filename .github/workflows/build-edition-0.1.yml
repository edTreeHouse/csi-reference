name: Build Edition 0.1 release record

on:
  push:
    branches:
      - edition-0.1-release
    paths:
      - "scripts/build_edition_0_1.sh"
      - "README.md"
      - "CITATION.cff"
      - ".zenodo.json"
      - "LICENSE-CONTENT.md"
      - ".github/workflows/build-edition-0.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: edition-0.1-release

      - name: Build fixed Edition 0.1 record
        run: bash scripts/build_edition_0_1.sh

      - name: Validate release inventory
        run: |
          test "$(find reference -maxdepth 1 -name '*.html' | wc -l)" -eq 18
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest['edition'] == '0.1'
          assert manifest['license'] == 'CC BY-NC 4.0'
          assert manifest['doi'] is None
          assert len(manifest['files']) == 22
          assert len(manifest['article_versions']) == 10
          PY

      - name: Commit generated scholarly record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference manifest.json
          if git diff --cached --quiet; then
            echo "Edition 0.1 record is already current."
          else
            git commit -m "Build fixed Edition 0.1 scholarly record [skip ci]"
            git push origin HEAD:edition-0.1-release
          fi
